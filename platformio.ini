[platformio]
src_dir = src
include_dir = include
lib_dir = lib

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

; ====================================================================
; AJUSTES CRÍTICOS PARA LA SUBIDA A LA PLACA FÍSICA
; ====================================================================
board_build.flash_mode = dio     ; <-- AÑADIDO: Fuerza el modo de flash a DIO, como indica tu log de error.
board_build.f_flash = 40000000L  ; <-- AÑADIDO: Reduce la velocidad del flash a 40MHz para mayor estabilidad.
; ====================================================================

; Librerías necesarias para el proyecto
lib_deps =
    ESP Async WebServer @ ^1.2.3
    AsyncTCP @ ^1.1.1
    ArduinoJson @ ^6.21.3

; Velocidad del monitor serial y de subida
monitor_speed = 115200
upload_speed = 115200

; Opciones de compilación optimizadas
build_flags = 
    -DCORE_DEBUG_LEVEL=3
    -O2

; Configuración de particiones por defecto
board_build.partitions = default.csv4